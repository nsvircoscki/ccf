<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" width="200" height="270">
  <defs>
    <radialGradient id="lg" cx="38%" cy="30%" r="68%">
      <stop offset="0%"   stop-color="#6fcf6f" />
      <stop offset="55%"  stop-color="#2e8b2e" />
      <stop offset="100%" stop-color="#1a5c1a" />
    </radialGradient>
    <radialGradient id="wg" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#7adaf0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38aed4" stop-opacity="0.2" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Water pool -->
  <ellipse cx="100" cy="226" rx="72" ry="22" fill="url(#wg)" />

  <!-- Leaf body -->
  <path
    d="M100,18 C72,58 34,108 34,158 C34,200 64,228 100,228 C136,228 166,200 166,158 C166,108 128,58 100,18 Z"
    fill="url(#lg)"
    filter="url(#shadow)"
  />

  <!-- Central vein -->
  <line x1="100" y1="30"  x2="100" y2="222" stroke="white" stroke-width="2.4" stroke-opacity="0.65" stroke-linecap="round" />

  <!-- Left veins -->
  <line x1="100" y1="85"  x2="58"  y2="118" stroke="white" stroke-width="1.6" stroke-opacity="0.5"  stroke-linecap="round" />
  <line x1="100" y1="128" x2="50"  y2="156" stroke="white" stroke-width="1.4" stroke-opacity="0.45" stroke-linecap="round" />
  <line x1="100" y1="165" x2="55"  y2="186" stroke="white" stroke-width="1.1" stroke-opacity="0.38" stroke-linecap="round" />

  <!-- Right veins -->
  <line x1="100" y1="85"  x2="142" y2="118" stroke="white" stroke-width="1.6" stroke-opacity="0.5"  stroke-linecap="round" />
  <line x1="100" y1="128" x2="150" y2="156" stroke="white" stroke-width="1.4" stroke-opacity="0.45" stroke-linecap="round" />
  <line x1="100" y1="165" x2="145" y2="186" stroke="white" stroke-width="1.1" stroke-opacity="0.38" stroke-linecap="round" />

  <!-- Water ripples -->
  <ellipse cx="100" cy="228" rx="52" ry="11"  fill="none" stroke="#7adaf0" stroke-width="2.2" stroke-opacity="0.9" />
  <ellipse cx="100" cy="233" rx="74" ry="16"  fill="none" stroke="#7adaf0" stroke-width="1.6" stroke-opacity="0.55" />
  <ellipse cx="100" cy="238" rx="92" ry="20"  fill="none" stroke="#7adaf0" stroke-width="1.0" stroke-opacity="0.28" />
</svg>
